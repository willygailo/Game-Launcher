##########################################################
# （1）bool 类型的 true 为 1， false 为 0
# （2）MSDK 相关的开关都要在前面加 MSDK_ 前缀
# （3）渠道相关的不要求
#  (4) 统一格式，如：XXX_DEBUG, XXX_APP_ID, XXX_APP_KEY
#  (5) 需要区分平台的 key，分别加上后缀 _IOS, _ANDROID
##########################################################


[MSDK 环境配置]
MSDK_URL = https://sg.itopsdk.com
#MSDK_URL = https://sg.itopsdk.com台湾政审先去连sg正式的，看能否通过
MSDK_GAME_ID = 10156
MSDK_SDK_KEY = 67355d9f09ef147de70c8092ada3c14c
MSDK_POP_URL = https://pop-sg.itopsdk.com
MSDK_PIX_FAAS_HOST =  https://sg.msdkfaas.com
MSDK_PIX_FAAS_UPDATE = 1
MSDK_HTTP_TIMEOUT = 15
MSDK_HTTPDNS_ENABLE = 0
MSDK_IPV6_ENABLE = 1
MSDK_DEBUG = 0
#台湾审核版本，其它的都去掉
#MSDK_DEBUG_CHANNEL = Beacon,TDM,Adjust,AppsFlyer,XG,Twitter,Garena
MSDK_DEBUG_CHANNEL = Bugly,TDM,Adjust,AppsFlyer,Google

MSDK_GUEST_FROM_SDCARD_ENABLE = 1

# MSDK_ENCRYPT_STORAGE 默认为0，请勿随意更改
MSDK_ENCRYPT_STORAGE = 1
# MSDK_DEVICE_INFO 默认为1，请勿随意更改
MSDK_DEVICE_INFO = 1
MSDK_V2_SIGN_ENABLE = 1 

MSDK_GCLOUD_REMOTE_CONFIG_ENABLE = 0

# 和 MSDK_HTTP_TIMEOUT 加起来的时间就是整个登录超时的时间
MSDK_LOGIN_OVERTIME = 30
# token 自动刷新时间间隔
MSDK_REFRESH_INTERVAL = 1800
# 配置启动 scheme 功能
MSDK_LIFECYCLE_SCHEME = 1

# LBS 功能 GPS 定位超时时间设置，默认4s
MSDK_LBS_GPS_TIMEOUT = 4000

[iOS keyChain 功能开关]
# 用于储存用户游客ID，保证卸载重装游客不变
MSDK_KEYCHAIN_ENABLE = 1

MSDK_XMLHTTPREQUEST_ENABLE = 1

[Guest数据迁移 功能开关]
# 用于找回老版本SDK的Guest缓存数据，1:开启找回  0:不开启 。默认是0
MSDK_COMPATIBLE_OLD_GUEST_ENABLE = 0
# 开启MSDKV3的Guest的数据迁移，1:开启找回  0:不开启， 默认开启
MSDK_MIGRA_GUEST_FROMV3_ENABLE = 1
# 开启MSDKV1的Guest的数据迁移，1:开启找回  0:不开启，默认不开启
MSDK_MIGRA_GUEST_FROM_ITOP1_ENABLE = 0

[Android 生命周期监控]

MSDK_LIFECYCLE_OBSERVERS = Garena,Facebook,Google,EmbedWebview,AppsFlyer,Firebase

[MSDK Crash 上报配置]
