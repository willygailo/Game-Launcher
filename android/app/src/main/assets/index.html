<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Launcher Pro Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #080612 100%);
      color: #e0e0e0;
      padding: 20px;
      min-height: 100vh;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 13px;
      color: #8f92a1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .card .val {
      font-size: 22px;
      font-weight: 700;
      color: #00f2fe;
      margin-top: 4px;
    }
    .card .lbl {
      font-size: 11px;
      color: #a0a5b5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
    }
    .btn-boost {
      background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
    }
    .btn-extreme {
      background: linear-gradient(135deg, #f857a6 0%, #ff5858 100%);
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
    }
    .session-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .session-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .session-info h4 {
      font-size: 14px;
      color: #ffffff;
    }
    .session-info p {
      font-size: 11px;
      color: #8f92a1;
      margin-top: 2px;
    }
    .session-badge {
      background: rgba(79, 172, 254, 0.2);
      border: 1px solid #4facfe;
      color: #4facfe;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚡ GAME LAUNCHER PRO Dashboard</h1>
    <p>Real-Time Hardware Telemetry & Session Log</p>
  </div>

  <div class="grid">
    <div class="card">
      <div class="lbl">Memory RAM</div>
      <div class="val" id="ramVal">--%</div>
    </div>
    <div class="card">
      <div class="lbl">Battery Temp</div>
      <div class="val" id="tempVal">--°C</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-boost" onclick="triggerBoost()">⚡ Boost RAM</button>
    <button class="btn btn-extreme" onclick="triggerExtreme()">🚀 EXTREME Mode</button>
  </div>

  <div class="section-title">🕒 Recent Session History</div>
  <div class="session-list" id="sessionList">
    <div style="text-align: center; color: #6c7293; font-size: 13px; padding: 20px;">
      No session history recorded yet.
    </div>
  </div>

  <script>
    function updateMetrics() {
      if (window.AndroidBridge && window.AndroidBridge.getDeviceMetricsJson) {
        try {
          const jsonStr = window.AndroidBridge.getDeviceMetricsJson();
          const data = JSON.parse(jsonStr);
          if (data.ramUsagePct !== undefined) {
            document.getElementById('ramVal').innerText = data.ramUsagePct + '%';
          }
          if (data.batteryTempC !== undefined) {
            document.getElementById('tempVal').innerText = data.batteryTempC + '°C';
          }
        } catch (e) {}
      }
    }

    function loadSessionHistory() {
      if (window.AndroidBridge && window.AndroidBridge.getSessionHistoryJson) {
        try {
          const jsonStr = window.AndroidBridge.getSessionHistoryJson();
          const list = JSON.parse(jsonStr);
          const container = document.getElementById('sessionList');
          if (list && list.length > 0) {
            container.innerHTML = '';
            list.forEach(item => {
              const div = document.createElement('div');
              div.className = 'session-item';
              const name = item.gameName || item.packageName || 'Game Session';
              const profile = item.spoofProfile || 'Default Profile';
              const fps = item.targetFps || 60;
              const dur = item.durationSec ? item.durationSec + 's' : 'Active';
              div.innerHTML = `
                <div class="session-info">
                  <h4>${name}</h4>
                  <p>${profile} • Duration: ${dur}</p>
                </div>
                <div class="session-badge">${fps} FPS</div>
              `;
              container.appendChild(div);
            });
          }
        } catch (e) {}
      }
    }

    function triggerBoost() {
      if (window.AndroidBridge && window.AndroidBridge.applyProfile) {
        window.AndroidBridge.applyProfile('PERFORMANCE');
        updateMetrics();
      }
    }

    function triggerExtreme() {
      if (window.AndroidBridge && window.AndroidBridge.applyProfile) {
        window.AndroidBridge.applyProfile('EXTREME');
        updateMetrics();
      }
    }

    setInterval(updateMetrics, 2000);
    updateMetrics();
    loadSessionHistory();
  </script>
</body>
</html>
