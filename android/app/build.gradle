apply plugin: 'com.android.application'
apply plugin: 'jacoco'

// Real release signing: keystore.properties is gitignored and lives next to
// this project (android/keystore.properties).
def keystoreProperties = new Properties()
def hasReleaseKeystore = false
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseKeystore = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
            .every { keystoreProperties[it] != null && !keystoreProperties[it].toString().isEmpty() }
}

android {
    namespace 'com.gamebooster.app'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.gamebooster.app"
        minSdk 31
        targetSdk 36
        versionCode 16007
        versionName "16.0.7-PRO"
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    sourceSets {
        main {
            res.srcDirs = [
                // Default resources (values, mipmap, etc.)
                'src/main/res',
                // Layouts — grouped by screen type
                'src/main/res-layouts/activities',
                'src/main/res-layouts/dialogs',
                'src/main/res-layouts/fragments',
                'src/main/res-layouts/hud',
                'src/main/res-layouts/items',
                // Drawables — grouped by component type
                'src/main/res-drawables/backgrounds',
                'src/main/res-drawables/badges',
                'src/main/res-drawables/buttons',
                'src/main/res-drawables/cards',
                'src/main/res-drawables/hud',
                'src/main/res-drawables/nav'
            ]
        }
    }

    buildTypes {
        debug {
            // Per-build version identity: 16.0.0-PRO-debug-<git sha>
            def gitSha = ''
            try {
                gitSha = 'git rev-parse --short HEAD'.execute(null, rootProject.projectDir).text.trim()
            } catch (Exception ignored) {
            }
            if (gitSha?.trim()) {
                versionNameSuffix "-debug-$gitSha"
            }
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            // Android stubs (Log, etc.) return defaults — pure-logic tests only
            returnDefaultValues = true
            all { jacoco { includeNoLocationClasses = true; excludes = ['jdk.internal.*'] } }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'debug') {
                outputFileName = "Game_Space_Debug.apk"
            } else {
                outputFileName = "Game_Space.apk"
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    def shizuku_version = "13.1.5"
    implementation "dev.rikka.shizuku:api:${shizuku_version}"
    implementation "dev.rikka.shizuku:provider:${shizuku_version}"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'

    // LSPosed / Xposed module API — compileOnly: same APK acts as launcher + module.
    // Vendored from rovo89/XposedBridge gh-pages (de.robv.android.xposed:api:82),
    // which is not published on Maven Central.
    compileOnly files('libs/XposedBridgeApi-82.jar')
    testImplementation files('libs/XposedBridgeApi-82.jar')
}

// Phase 1.3: JaCoCo unit-test coverage report (config/spoofer packages)
jacoco {
    toolVersion = '0.8.12'
}

task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {
    reports {
        xml.required = true
        html.required = true
    }
    def excluded = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/*$*.class', '**/Manifest*']
    def javaClasses = fileTree(dir: "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: excluded)
    classDirectories.setFrom(files(javaClasses))
    sourceDirectories.setFrom(files("$projectDir/src/main/java"))
    executionData.setFrom(fileTree(dir: "$buildDir/jacoco", includes: ['**/*.exec']))
}
