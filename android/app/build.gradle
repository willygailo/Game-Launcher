apply plugin: 'com.android.application'
apply plugin: 'jacoco'

// Real release signing: keystore.properties is gitignored and lives next to
// this project (android/keystore.properties).
def keystoreProperties = new Properties()
def hasReleaseKeystore = false
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasReleaseKeystore = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
            .every { keystoreProperties[it] != null && !keystoreProperties[it].toString().isEmpty() }
}

android {
    namespace 'com.gamebooster.app'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.gamebooster.app"
        minSdk 33
        targetSdk 36
        versionCode 16050
        versionName "16.5.0-PRO"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    ndkVersion '27.0.12077973'

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                // Fallback to debug keystore for development / local release builds
                storeFile rootProject.file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    sourceSets {
        main {
            res.srcDirs = [
                'src/main/res',
                'src/main/res-layouts/activities',
                'src/main/res-layouts/dialogs',
                'src/main/res-layouts/fragments',
                'src/main/res-layouts/hud',
                'src/main/res-layouts/items',
                'src/main/res-drawables/backgrounds',
                'src/main/res-drawables/badges',
                'src/main/res-drawables/buttons',
                'src/main/res-drawables/cards',
                'src/main/res-drawables/hud',
                'src/main/res-drawables/nav'
            ]
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        debug {
            // Per-build version identity: 16.4.0-PRO-debug-<git sha>
            def gitSha = ''
            try {
                gitSha = 'git rev-parse --short HEAD'.execute(null, rootProject.projectDir).text.trim()
            } catch (Exception ignored) {
            }
            if (gitSha?.trim()) {
                versionNameSuffix "-debug-$gitSha"
            }
        }
        release {
            signingConfig (hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module',
                'META-INF/*.version',
                'META-INF/INDEX.LIST',
                'DebugProbesKt.bin'
            ]
        }
        jniLibs {
            useLegacyPackaging = false
            pickFirsts += ['**/libgamebooster_native.so']
        }
    }

    testOptions {
        unitTests {
            // Android stubs (Log, etc.) return defaults — pure-logic tests only
            returnDefaultValues = true
            all { jacoco { includeNoLocationClasses = true; excludes = ['jdk.internal.*'] } }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'debug') {
                outputFileName = "Game_Space_Debug.apk"
            } else {
                outputFileName = "Game_Space.apk"
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'

    def shizuku_version = "13.1.5"
    implementation "dev.rikka.shizuku:api:${shizuku_version}"
    implementation "dev.rikka.shizuku:provider:${shizuku_version}"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    testImplementation 'junit:junit:4.13.2'
}

// Phase 1.3: JaCoCo unit-test coverage report (config/spoofer packages)
jacoco {
    toolVersion = '0.8.12'
}

task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {
    reports {
        xml.required = true
        html.required = true
    }
    def excluded = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/*$*.class', '**/Manifest*']
    def javaClasses = fileTree(dir: "$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: excluded)
    classDirectories.setFrom(files(javaClasses))
    sourceDirectories.setFrom(files("$projectDir/src/main/java"))
    executionData.setFrom(fileTree(dir: "$buildDir/jacoco", includes: ['**/*.exec']))
}
