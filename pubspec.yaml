name: game_space
description: "GAME SPACE - Ultimate Android Gaming Optimization App with setprop tweaks, GPU/CPU/Touch/Network performance controls."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  get_it: ^7.7.0
  go_router: ^13.2.5
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.2
  permission_handler: ^11.3.1
  device_info_plus: ^9.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
