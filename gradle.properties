org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: 40-60% faster incremental builds by caching the configuration phase
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=35,36
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
# R8 full mode: aggressive dead code elimination, class merging, field trimming beyond default R8
android.enableR8.fullMode=true
